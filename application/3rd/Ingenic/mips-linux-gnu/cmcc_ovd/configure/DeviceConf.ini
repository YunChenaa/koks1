#deviceConfiguration
[deviceConfiguration]
#设备ID
devId:
devCmei:
#硬件名称
hardwareModel:test_device
#硬件版本号
firmware_model:1.2.11
#modelId
modelId:IPC_HDC56
#应用程序类型，0表示精简版应用程序，1表示完整版应用程序
app_model:1
app_version:1.0.99

wifi_ssid:
wifi_signal:
upBandwidth:
downBandwidth:
ipAddr:
macAddr:
battery:100
#是否后台执行
run_deamo:0

[voipDevice]
#固话平台产品创建后自动生成的
app_key:
# 固话平台产品创建后自动生成的
app_secret:
# 格式为cmcc-AndlinkID-序列号
device_id:
#deviceClientInfo
[deviceClientInfo]
#OVDDeviceID:1401705980000022
OVDLoginPassword:
OVDMediaEncPassword:
#OVDHardWareModel:test_device
#是否开启服务调度
enableserviceschedule:1
#服务调度url
#servicescheduleurl:http://elb-1-2446eb7f46ea7316.elb.cn-northwest-1.amazonaws.com.cn:9080/ovp/getServerAddr
servicescheduleurl:https://video.komect.com/ovp/getServerAddr
#OVC服务器地址
passDomain:36.148.0.120
#OVC服务器端口号
passPort:9001
#OVC服务器加密端口号
securepassport:
#p2p服务器地址
p2p_passDomain:
#p2p服务器端口号
p2p_passPort:
#turn服务器地址
turnDomain:
#turn服务器端口号
turnPort:
#休眠服务器地址
hibernationDomain:
#休眠服务器端口号
hibernationPort:
#休眠时心跳间隔
hibernationHBInterval:100
#设备最大支持的P2P个数
maxP2PSession:4
#bindID 取值为字符串。若值为0，则采用声波/二维码识别出来的值；否则为此设置的值
bindId:0

#deviceConfig  设备配置
[deviceConfigInfo]
#设备支持多少个channel，模拟器一般是一个
channelsInfoCount:1
#时区信息
tz:8
#<必填，只读,字符串型：上次重启时间，格式”YY-MM-DDTHH:MM:SS”>
autoreboot_last_reboot:"2020-07-20T20:18:18"
ovd_data_path:"./"
SDK_partition_mounting_path:"./"
ovd_log_path:"./log/"
#第一个channel信息
[channel0]
#channel ID
channel:0
#通道使能开关，通道关闭后，应停止该通道的流媒体采集、告警、云台操作等相关功能
# <可选，只读，整形：每秒帧数>
video_framerate:15
#<可选，只读，整形：码流比特率>
video_bitrate:1024
#<可选，只读，整形：图像宽度像素>
video_width:256
#<可选，只读，整形：图像高度像素>
video_height:256
#video_framerate:10
#video_colorDepth:2
#<可选，只读，整形：码流gop,单位帧>
video_frameInterval:60
#video_reserve:0

#<可选，只读，整形：采样率，即每秒钟采用数目，合法值8000/16000/32000/44100/48000>
audio_samplesRate:16000
#<可选，只读，整形：码流比特率>
audio_bitrate:1024
#audio_waveFormat:0x6163
#audio_channelNumber:2
#audio_blockAlign:0
#<可选，只读，整形：位宽，即每个sample的比特数>
audio_bitsPerSample:10
#<可选，只读，整形：每一帧中包含的sample数，AAC算法标准固定为1024>
audio_samplePerframe:1024
#<可选，只读，整形：声道数>
audio_channel:1
#audio_frameInterval:1
#audio_reserve:0

[devCap]
#设备类型 0 代表普通IPC， 1代表低功耗中继型设备， 2代表低功耗非中继型设备，默认值为0，普通IPC， 1.21版本新增
device_type: 0
#布尔型，是否支持低功耗相关功能
enable_low:1
#布尔型，是否支持低功耗唤醒（低功耗设备）
support_awaked: 1
#布尔型，是否支持低功耗唤醒开关（低功耗设备）
support_awaked_switch: 0
#布尔型，是否智能模式（低功耗设备）
smart_mode:1
#布尔型，是否支持4G
support_4G: 1
#布尔型，是否支持主子码流
multi_stream:1
#布尔型，是否支持AOV
support_aov:1
#字符串，码流加密
stream_encryption_mode:1


#是否支持云台
have_ptz: 1
#是否支持云台预置位
support_ptz_preset: 1
#是否支持消控指令
stopalarm: 1
#是否支持手动调节倍率
zoomcontrol: 0
#是否支持手动调焦
focuscontrol: 1
#是否支持电池供电
have_battery: 1
#是否支持视频输出
have_audio_out: 1
#是否支持对讲输出
have_voice_out: 1
#是否支持移动追踪
have_trace: 1
#移动追踪支持的目标，最低位表示"人形"0x01，第二位表示"车辆"0x02，第三位表示"宠物"0x04，低三位表示"全部"0x07，默认0表示不支持设置追踪目标
have_trace_set_target: 0
#1.55-是否支持设置门铃机位
have_doorbell_preset: 1
#"ivrs": <布尔型：是否支持ivrs协议，默认值为false，表示云存只支持ivr协议>,开启时，云存走ivrs
ivrs:1
support_set_gop:0
#AI相关
#是否支持设备上报人脸AI，若不支持，则无该字段
AI_supportface:1
#是否支持人脸曝光度调节，默认值为false
AI_face_exposureadjust:1
#抓拍模式调节列表选项，若没有，则设备不支持模式切换,默认“quality”:代表质量抓拍，“quick”:代表快速抓拍
AI_face_capturemodelists:quality,quick
#0不支持，1：只支持矩形，n(n>=3):支持不规则n边形
AI_face_zone:1
#是否口罩检测功能
AI_face_maskDetection:1
# <1.49,是否支持<语音输出>联动策略的持续告警>
AI_face_support_speech_keep_alarm:1
# <1.49,是否支持<语音输出>联动策略的告警间隔设置>
AI_face_support_speech_set_interval:1
# <1.49,是否支持<联动警灯>联动策略的持续告警>
#是否支持明厨亮灶功能
AI_supportkitchen:1
#检测类型列表选项,选项之间以逗号相隔，若没有，则设备不支持检测类型更改，检测类型选项有“mask"(口罩),"cap"(帽子),“clothes"(衣服)
AI_kitchen_capturemodelists:clothes
#设备所支持工服颜色列表，逗号相隔，目前所支持的有“white”(白),"black"(黑),"red"(红),"blue"(蓝),"green"（绿）
AI_kitchen_clothesColorList:white
#0:不支持，1:只支持矩形，n(n>=3)支持不规则n边形
AI_kitchen_zone:1
#是否支持车型侦测
AI_supportvehicle:0
#0不支持， 1：只支持矩形， n(n>=3)，支持不规则n边形
AI_vehicle_zone:1
#是否支持车辆识别的安装场景
AI_vehicle_detect_site:1
# <1.49,是否支持<语音输出>联动策略的持续告警>
AI_vehicle_support_speech_keep_alarm:1
# <1.49,是否支持<语音输出>联动策略的告警间隔设置>
AI_vehicle_support_speech_set_interval:1
# <1.49,是否支持<联动警灯>联动策略的持续告警>
AI_vehicle_support_light_keep_alarm:1
#是否支持非机动车检测（梯控）
AI_supportnonmotorvehicle:1
#检测类型选项列表，选项之间用逗号相隔，目前端侧类型选项有”electromobile"（电瓶车),”bike"(自行车）
AI_nonmotorvehicle_capturemodelists:electromobile,bike
#0不支持， 1：只支持矩形， n(n>=3)，支持不规则n边形
AI_nonmotorvehicle_zone:1
# <1.49,是否支持<语音输出>联动策略的持续告警>
AI_nonmotorvehicle_support_speech_keep_alarm:1
# <1.49,是否支持<语音输出>联动策略的告警间隔设置>
AI_nonmotorvehicle_support_speech_set_interval:1
# <1.49,是否支持<联动警灯>联动策略的持续告警>
#是否支持设备上报客流AI，若不支持，则无该字段
AI_supportpassenger:1
#是否支持客流曝光度调节，默认值为false
AI_passenger_exposureadjust:1
#客流抓拍模式调节列表选项，若没有，则设备不支持模式切换,默认“quality”:代表质量抓拍，“quick”:代表快速抓拍
AI_passenger_capturemodelists:quality,quick
#客流区域, 0不支持，1：只支持矩形，n(n>=3):支持不规则n边形
AI_passenger_zone:1
#1.46.0-布尔型： 迎宾促销， 0不支持，1：只支持矩形
AI_passenger_supportwelcome:1
#1.46.0-布尔型： 迎宾促销时间段， 0不支持，1：只支持矩形
AI_passenger_supportalerttime:1
#1.46.0-布尔型： 手势识别， 0不支持，1：只支持矩形
AI_support_gesture_recognition:1
AI_support_gesture_call:1
AI_support_set_duration:1
AI_support_set_calltime:1
AI_support_gesture_help:1

#是否支持设备上报高空抛物，若不支持，则无该字段
AI_support_parabolic_aerial:1
#高空抛物检测区域最大个数
AI_parabolic_aerial_detect_zone_num:3
#高空抛物检测区域绘制多边形最大边数, 0不支持，1：只支持矩形，n(n>=3):支持不规则n边形
AI_parabolic_aerial_detect_zone:6
#高空抛物屏蔽区域最大个数
AI_parabolic_aerial_shield_zone_num:2
#高空抛物屏蔽区域绘制多边形最大边数, 0不支持，1：只支持矩形，n(n>=3):支持不规则n边形
AI_parabolic_aerial_shield_zone:5
#高空抛物楼层设置最大个数
AI_parabolic_aerial_floor_configuration_num:3


#是否支持设备上报区域人数统计，若不支持，则无该字段, 0表示不支持，1表示支持，默认不支持
AI_support_regional_people_statistics:1
#是否支持设置检测时间， 0表示不支持，1表示支持，默认不支持
AI_support_regional_people_alert_time:1
#是否支持设置OSD叠加人数， 0表示不支持，1表示支持，默认不支持
AI_support_regional_people_osd_status:1
#区域人数触发预警的人数，个数，0表示不支持，其他值表示对应配置项“触发预警的人数”的最大值限制，默认不支持
AI_support_regional_people_count:100
#区域人数告警上报间隔时间，分钟，0表示不支持，其他值表示对应配置项“告警上报间隔时间”的最大值限制，默认不支持
AI_support_regional_people_alarm_report_duration:60
#区域人数定时上传，分钟，0表示不支持，其他值表示对应配置项“区域人数定时上传”的最大值限制，默认不支持
AI_support_regional_people_detect_result_report_duration:30
#检测计划的个数，0不支持，最大值10个，默认不支持
AI_support_regional_people_detect_plans_num:1
#检测区域的个数，0不支持，最大值10个，默认不支持
AI_support_regional_people_alarm_area_num:1
#检测区域, 整型：0不支持，1：只支持矩形，n(n>=3):支持不规则n边形，目前只支持4边形。最大支持10边形
AI_support_regional_people_alarm_zone:1
# <1.49,是否支持<语音输出>联动策略的持续告警>
AI_regional_people_support_speech_keep_alarm:1
# <1.49,是否支持<语音输出>联动策略的告警间隔设置>
AI_regional_people_support_speech_set_interval:1
# <1.49,是否支持<联动警灯>联动策略的持续告警>
AI_regional_people_support_light_keep_alarm:1


#是否支持设备上报车道线，若不支持，则无该字段
AI_support_lane_line:1
#支持车道线数量，1：单个车道线， 2：双车道线， 目前只支持配置1和2
AI_lane_line_num:1
#车道线区域, 整型：0不支持， 1：只支持矩形， n(n>=3)，支持不规则n边形，目前只支持矩形
AI_lane_line_zone:1

#是否支持设备上报离岗检测，若不支持，则无该字段
AI_support_off_duty:1
#设置在岗人数的最大值，目前支持最大值5
AI_support_on_duty_count:5
#设置离岗时长的最大值，目前支持最大值60
AI_support_off_duty_durtion:60
#是否支持检测时间设置
AI_support_off_duty_alert_time:1
#离岗检测，检测计划数设置,目前只支持1个
AI_support_off_duty_detect_plans_num:1
#离岗检测，检测区域数设置,目前只支持1个
AI_support_off_duty_alarm_area_num:1
#检测区域, 整型：0不支持， 1：只支持矩形， n(n>=3)，支持不规则n边形，目前只支持矩形
AI_off_duty_zone:1

#设备是否支持头盔佩戴检测
AI_support_helmet_wearing_detection:1
#检测区域, 整型：0不支持， 1：只支持矩形， n(n>=3)，支持不规则n边形，目前只支持矩形
AI_helmet_wearing_zone:1
#是否支持检测时间设置
AI_support_detect_time:1

#设备是否支持家人识别-1.53
AI_support_family_recognition:0
#设备是否支持人脸管理
AI_support_face_management:0
#设备是否支持设置检测时间段
AI_support_set_schedule_time:0

#1.55-设备是否支持隐私遮蔽
AI_support_privacy_masking:1
#1.55-隐私遮蔽区域,整型：0不支持， 1：只支持矩形， n(n>=3)，支持不规则n边形
AI_support_privacy_masking_zone:1

#告警区域联动方式
#字符串，警戒区域告警所支持的联动策略列表，选项之间以逗号相隔，可选项有”speech“（语音输出), "light"(联动警灯) , "buz"(蜂鸣器）
linkagemode_alertarea:speech,light,buz
linkagemode_vehicledetection:speech,light
linkagemode_nonmotorvehicledetection:speech,light,buz
linkagemode_maskdetection:speech
linkagemode_regionalpeopledetection:speech
linkagemode_helmet_wearing_detection:speech,light
linkagemode_family_recognition:speech,light #1.53


#告警相关
#是否支持外包报警
have_alarms_io: 1
#是否支持哭声侦测
have_alarms_cry: 1
#是否支持啼哭安抚功能
support_crying_pacify: 1
crying_pacify_audio_playing_count: 10
support_crying_pacify_audio_playing_volumn: 1
crying_pacify_audio_playing_type: 1
#是否支持声音侦测
have_alarms_voice: 1
#是否支持移动侦测
have_alarms_motion: 1
support_alarms_motion_zone:1
#是否支持人形侦测：
have_alarms_body: 1
support_alarms_body_zone:1
#是否支持伴网侦测
have_alarms_cross: 1
#是否支持pir红外物体移动侦测
have_alarms_pir: 1
#是否支持pir逗留模式
have_alarms_pir_staymode: 1
#是否支持撬锁侦测
have_alarms_lossLock: 1
#是否支撑警戒功能
have_alarms_alertarea:1
have_alarms_alertarea_zone:1
support_alarms_alertarea_zone:4
# <1.49,是否支持<语音输出>联动策略的持续告警>
have_speech_keep_alarm:1
# <1.49,是否支持<语音输出>联动策略的告警间隔设置>
have_speech_set_interval:1
# <1.49,是否支持<联动警灯>联动策略的持续告警>
have_light_keep_alarm:1
#是否支持智能驱离（针对带云台的警戒设备）
have_alertarea_expel:1
#是否支持3d光传感器
support_3d_light_sensor:0
#1.57 是否支持宠物侦测：
have_alarms_pet: 1
support_alarms_pet_zone:1

#庭院灯控制
yard_light_brightness:1
yard_light_manual_control:1
yard_light_timed_schedule:2

#是否支持通道使能开关
have_switch: 1
#是否支持SD卡
have_SD: 1
#是否支持带屏开关
have_screen: 1
#是否支持led灯开关
have_led: 1
#是否支持软探针
have_support_softprobe: 1
#是否支持自动重启
have_auto_reboot: 1
#"video_quality": <字符串列表：支持的视频清晰度选项列表，列表元素可选值为：ld/sd/hd/fhd，分别代表低清/标清/高清/全高清，默认支持sd和hd>
video_quality:sd,hd,fhd
#<字符串列表(中间用,隔开)：支持的视频编码格式列表，列表元素可选值为：h264/h265,默认支持h264>
video_formats_supportlists:h264,h265
#<布尔型： 设备是否支持对讲音量调节，默认值为false>
have_voiceout_volume: 1
#<布尔型： 是否支持设备支持门铃音量设置,默认值为false>
have_doorbell_volume: 1
#<布尔型: 普通摄像头是否支持设备切换夜视模式，夜视模式分为开启/关闭/自动>
support_set_normal_nightvision_mode: 1
#<布尔型：全彩摄像头是否支持设备切换夜视模式，夜视模式分为黑白夜视/全彩夜视/智能夜视>
support_set_color_nightvision_mode: 1
#1.55-布尔型：摄像头是否支持黑光夜视
support_ultraviolet_nightvision_mode:1
#1.55-布尔型：摄像头是否支持补光灯（白光灯）控制
support_set_fill_light:1
#1.55-布尔型，设备补光灯是否支持自定义时间段
support_set_fill_light_schedule_time:
#1.55-布尔型，设备补光灯是否支持设置自动开关模式
support_set_fill_light_auto:1
#<布尔型：人脸识别是否支持区域配置，1支持 0不支持>
have_face_zone:1
#<布尔型：是否支持OSD文本>
osd_text: 1
#<布尔型： 是否支持OSDlog>
osd_logo: 1
#<布尔型，设备是否集成和家固话>
enable_hjkh:1
#<布尔型，是否支持呼叫偏好功能；呼叫偏好：可设置在发起呼叫时，普通电话优先或者APP通话优先
preference_call:1
#<布尔型，是否支持呼叫号码设置的功能；呼叫号码：可设置点击呼叫按键后，摄像头呼叫的号码（被叫号码）
set_calling_number:1
#<布尔型，是否支持手机勿扰模式；手机勿扰是控制设备端主叫手机端。可设置设备勿扰开关是否打开，如果打开，可设置勿扰时间>
not_disturb_mode:1
#<布尔型，是否支持设备勿扰模式，设备勿扰是控制手机端主叫设备端>
not_disturb_device_mode:1
#<布尔型，是否支持自动挂断功能；自动挂断：可设置检测到访客离开/进门后自行停止呼叫>
auto_hangup:1
#<布尔型，是否支持语音呼叫号码功能；如果设备上报支持，则APP新增“语音呼叫号码”配置项，配置完成后，可实现通过语音给指定的号码打电话>
voice_calling_number:1
#<字符串列表(中间用,隔开)：支持的extension方法列表，列表元素可选值为：echotest/ccrtc>
have_support_extension:echotest,ccrtc

#<布尔型，设备是否支持机器人协议>
enable_EBO:1
#<布尔型，是否支持左右前后移动>
EBOmove:1
#<布尔型，是否支持防跌落>
EBOnofall:1
#<布尔型，是否支持激光>
EBOlaser:1
#<布尔型，是否支持向前猛冲>
EBOonrush:1
#<布尔型，是否支持回充>
EBOrecharge:1
#<布尔型，是否支持抖动>
EBOshake:1
#<布尔型，是否支持转圈>
EBOspin:1
#<布尔型，是否支持移动追踪，开启后  默认值是： 人形追踪> 1.27新增
EBOtrack:1
#<布尔型，是否支持人形追踪追踪，开启后支持人形追踪> 1.27新增
EBObody_track:1
#<布尔型，是否支持宠物追踪追踪，开启后支持宠物追踪> 1.27新增
EBOpets_track:1
#<布尔型，是否支持巡航功能，开启后支持巡航> 1.29新增
EBOcruise:1
#<布尔型，是否支持防碰撞功能，开启后支持防碰撞> 1.29新增
EBOcollision:1
#<布尔型，是否支持提示音功能，开启后支持提示音> 1.34新增
EBOreminder:1

EBOspeed:1
#<字符串，支持机器人控制类型> 1.33新增
robot_ctrl:ROBOT_OWL

#喂食功能
enable_petfeeder:1
#<int型，数量为支持的喂食份数，值必须大于0>
petfeeder_feed_num:0
#<int型，数量为支持的最大计划条数，值必须大于0，最大值为10>
petfeeder_plan_num:0

#<整型，位运算0x0F。设备是否支持设置检测目标。最低位表示"人形" 0x01，第二位表示"机动车" 0x02，第三位表示"非机动车" 0x04，第四位表示"其他" 0x08，默认0表示不支持>
alertarea_support_set_target:8
#<布尔型，是否支持区域入侵后设置停留时长。0表示不支持，1表示支持，默认不支持>
alertarea_support_staymode_time:1
#<布尔型，设备是否支持设置检测时间段，0表示不支持，1表示支持，默认不支持>
alertarea_support_set_alerttime:1
# 区域入侵<1.41.0新增,整形,设备支持警戒区域数量,厂商上报,默认值为1>
alertarea_num:2
# <1.49,是否支持<语音输出>联动策略的持续告警>
alertarea_support_speech_keep_alarm:1
# <1.49,是否支持<语音输出>联动策略的告警间隔设置>
alertarea_support_speech_set_interval:1
# <1.49,是否支持<联动警灯>联动策略的持续告警>
alertarea_support_light_keep_alarm:1

#<1.33 新增 布尔型：是否支持越界侦测功能，默认值为false>
enable_transgression:1
#<整型，位运算0x0F。设备是否支持设置检测目标。最低位表示"人形" 0x01，第二位表示"机动车" 0x02，第三位表示"非机动车" 0x04，第四位表示"其他" 0x08，默认0表示不支持>
transgression_support_set_target:8
#<布尔型，设备是否支持设置检测时间段，0表示不支持，1表示支持，默认不支持>
transgression_support_set_alerttime:1
#<布尔型，设备是否支持设置越界规则线，0表示不支持，1表示支持，默认不支持>
transgression_upport_set_statistics_line:1
#<1.49.0新增,整形,设备支持设置额外越界规则线（第二条及以上规则线）数量,默认值为0>
statistics_line_another_num:0
# <1.49,是否支持<语音输出>联动策略的持续告警>
transgression_support_speech_keep_alarm:1
# <1.49,是否支持<语音输出>联动策略的告警间隔设置>
transgression_support_speech_set_interval:1
# <1.49,是否支持<联动警灯>联动策略的持续告警>
transgression_support_light_keep_alarm:1
#<1.33新增，字符串，越界侦测告警所支持的联动策略列表，选项之间以逗号相隔，可选项有"speech"（语音输出), "light"(联动警灯) , "buz"(蜂鸣器），默认值为空字符串
linkagemode_transgression:speech,light,buz

#<1.33新增，整型，位运算0x0F。设备是否支持机器人管家相关功能。最低位表示"天气预报" 0x01，第二位表示"吃药提醒" 0x02，默认0表示不支持>
robot_housekeeper:2

#<1.36新增，布尔型，设备是否支持四合一烟感功能>
smoke_sensor:1

#<1.55新增，布尔型，设备是否支持WIFI感知联动>
support_wifi_sensing:1
#<1.55新增，布尔型，设备WIFI感知联动是否支持计划时间>
wifi_sensing_support_set_schedule_time:1
#<1.55新增，布尔型，设备WIFI感知联动是否支持设置模式>
wifi_sensing_support_set_sensing_mode:1
#<1.55.1新增，布尔型，设备是否支持睡眠检测>
support_sleep_monitor:1
support_sleep_detection:1
support_sleep_detection_sens:1
support_face_cover:1
support_face_cover_sens:1
support_face_cover_mode:1
support_wakeup_detection:1
support_wakeup_detection_sens:1

